<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Multiplayer Cyber Arena</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #ui-container { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 2px 2px 4px #000; z-index: 10; pointer-events: none; }
        .bar { width: 200px; height: 20px; background: #333; border: 2px solid #fff; border-radius: 5px; margin-bottom: 5px; overflow: hidden; }
        .fill { height: 100%; transition: width 0.1s ease; }
        #player-hp-fill { background: #00ffcc; width: 100%; }
        #boss-hp-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); text-align: center; color: #ff0055; font-weight: bold; font-size: 20px; z-index: 10; display: none; }
        #boss-hp-bar { width: 400px; height: 25px; background: #222; border: 3px solid #ff0055; border-radius: 5px; }
        #boss-hp-fill { background: linear-gradient(90deg, #ff0055, #ff5500); width: 100%; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; background: #00ffcc; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; box-shadow: 0 0 8px #00ffcc; }
        #lobby-status { margin-top: 5px; font-size: 14px; color: #aaa; }
        #instructions { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.6); text-align: center; font-size: 14px; z-index: 10; pointer-events: none; }
    </style>
    <!-- Include Three.js via CDN -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="ui-container">
        <div>PLAYER HEALTH</div>
        <div class="bar"><div id="player-hp-fill" class="fill"></div></div>
        <div id="score-board">Boss Stage: <span id="stage-val">1</span></div>
        <div id="lobby-status">Multiplayer: Connecting to mock-relay pipeline...</div>
    </div>

    <div id="boss-hp-container">
        <div id="boss-name">OMEGA NEXUS CORE</div>
        <div id="boss-hp-bar"><div id="boss-hp-fill" class="fill"></div></div>
    </div>

    <div id="instructions">WASD to Move | Mouse to Aim | Click to Shoot / Lock Pointer</div>

    <script>
        // --- GAME CONFIGURATION & GLOBALS ---
        const CONFIG = {
            playerSpeed: 0.15,
            projectileSpeed: 0.8,
            bossMaxHp: 1000,
            playerMaxHp: 100
        };

        let scene, camera, renderer;
        let player = { hp: CONFIG.playerMaxHp, x: 0, z: 20, targetX: 0, targetZ: 20, score: 0 };
        let boss = { mesh: null, hp: CONFIG.bossMaxHp, state: 'idle', timer: 0, stage: 1 };
        let keys = { w: false, a: false, s: false, d: false };
        let mouse = { x: 0, y: 0 };
        
        let projectiles = [];
        let bossProjectiles = [];
        let particles = [];
        let remotePlayers = {}; // Structure to hold networked player meshes

        // --- INITIALIZATION ---
        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020208);
            scene.fog = new THREE.FogExp2(0x020208, 0.015);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // Renderer Setup with High-Quality Settings
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            document.body.appendChild(renderer.domElement);

            // Environment & Lighting
            buildEnvironment();
            setupLighting();

            // Spawn Entities
            spawnBoss();

            // Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('keydown', (e) => handleKeyboard(e, true));
            document.addEventListener('keyup', (e) => handleKeyboard(e, false));
            document.addEventListener('click', () => {
                document.body.requestPointerLock();
                firePlayerProjectile();
            });
            document.addEventListener('mousemove', handleMouseMove);

            // Mock Networking Engine for GitHub Pages Architecture
            initNetworkPipeline();

            // Start Main Loop
            animate();
        }

        // --- ENVIRONMENT GENERATION (HIGH GRAPHICS STYLING) ---
        function buildEnvironment() {
            // Cyber Grid Floor
            const floorGeo = new THREE.PlaneGeometry(200, 200, 50, 50);
            const floorMat = new THREE.MeshStandardMaterial({
                color: 0x111122,
                roughness: 0.2,
                metalness: 0.8,
                wireframe: false
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Visual Grid Overlay
            const gridHelper = new THREE.GridHelper(200, 50, 0x00ffcc, 0x223344);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            // Sci-Fi Surround Pillars
            const pillarGeo = new THREE.BoxGeometry(4, 30, 4);
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x0a0a15, roughness: 0.5 });
            
            for(let i = 0; i < 12; i++) {
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                let angle = (i / 12) * Math.PI * 2;
                pillar.position.set(Math.cos(angle) * 60, 15, Math.sin(angle) * 60);
                pillar.castShadow = true;
                pillar.receiveShadow = true;
                scene.add(pillar);
            }
        }

        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.15);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(40, 100, 40);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 200;
            const d = 80;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            // Cyber Neon Glow Lights
            const neonBlue = new THREE.PointLight(0x00ffcc, 2, 50);
            neonBlue.position.set(-20, 5, -20);
            scene.add(neonBlue);

            const neonPink = new THREE.PointLight(0xff0055, 2, 50);
            neonPink.position.set(20, 5, -20);
            scene.add(neonPink);
        }

        // --- ENEMY BOSS MECHANICS ---
        function spawnBoss() {
            const group = new THREE.Group();

            // Main Core
            const coreGeo = new THREE.OctahedronGeometry(6, 0);
            const coreMat = new THREE.MeshStandardMaterial({
                color: 0xff0055,
                emissive: 0x550011,
                roughness: 0.1,
                metalness: 0.9
            });
            const core = new THREE.Mesh(coreGeo, coreMat);
            core.castShadow = true;
            group.add(core);

            // Outer Shield Rings
            const ringGeo = new THREE.TorusGeometry(9, 0.6, 16, 100);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, metalness: 0.8 });
            const ring1 = new THREE.Mesh(ringGeo, ringMat);
            const ring2 = new THREE.Mesh(ringGeo, ringMat);
            ring2.rotation.x = Math.PI / 2;

            group.add(ring1);
            group.add(ring2);

            group.position.set(0, 10, -30);
            scene.add(group);
            boss.mesh = group;

            document.getElementById('boss-hp-container').style.display = 'block';
        }

        function runBossAI(time) {
            if (!boss.mesh || boss.hp <= 0) return;

            // Animations
            boss.mesh.children[0].rotation.y += 0.02;
            boss.mesh.children[1].rotation.y -= 0.01;
            boss.mesh.children[2].rotation.x += 0.01;

            // Hover Float effect
            boss.mesh.position.y = 10 + Math.sin(time * 0.002) * 2;

            // Attack Cycles
            boss.timer++;
            if (boss.timer % 60 === 0) {
                fireBossAttack(time);
            }
        }

        function fireBossAttack(time) {
            // Hellfire radial patterns or targeted bullet hell
            const attackPattern = Math.floor(Math.random() * 2);
            
            if (attackPattern === 0) {
                // Radial Blast
                const count = 12 + boss.stage * 4;
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    createBossProjectile(boss.mesh.position, new THREE.Vector3(Math.cos(angle), (Math.random() - 0.5) * 0.2, Math.sin(angle)));
                }
            } else {
                // Directed Scatter stream at player position
                const dir = new THREE.Vector3(player.x - boss.mesh.position.x, 0, player.z - boss.mesh.position.z).normalize();
                for(let i = 0; i < 3; i++){
                  const variance = new THREE.Vector3((Math.random()-0.5)*0.3, 0, (Math.random()-0.5)*0.3);
                  createBossProjectile(boss.mesh.position, dir.clone().add(variance).normalize());
              }
}
}
// --- CLIENT CONTROLS & PHYSICS ---
function handleKeyboard(event, isDown) {
switch (event.key.toLowerCase()) {
case 'w': keys.w = isDown; break;
case 'a': keys.a = isDown; break;
case 's': keys.s = isDown; break;
case 'd': keys.d = isDown; break;
}
}
function handleMouseMove(e) {
if (document.pointerLockElement === document.body) {
mouse.x += e.movementX * 0.002;
mouse.y -= e.movementY * 0.002;
mouse.y = Math.max(-Math.PI/3, Math.min(Math.PI/3, mouse.y)); // Cap vertical look
}
}
function updatePlayerPhysics() {
// Local movement vector evaluation
let forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), mouse.x);
let right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), mouse.x);
let moveDir = new THREE.Vector3();
if (keys.w) moveDir.add(forward);
if (keys.s) moveDir.add(forward.clone().negate());
if (keys.d) moveDir.add(right);
if (keys.a) moveDir.add(right.clone().negate());
moveDir.normalize().multiplyScalar(CONFIG.playerSpeed);
player.x += moveDir.x;
player.z += moveDir.z;
// Restrict bounds
player.x = Math.max(-95, Math.min(95, player.x));
player.z = Math.max(-95, Math.min(95, player.z));
// Snap camera tracking properties
camera.position.set(player.x, 3, player.z);
const targetLook = new THREE.Vector3(0, 0, -1).applyResizingMatrix;
const lookTarget = new THREE.Vector3(
player.x + Math.sin(mouse.x) * Math.cos(mouse.y),
3 + Math.sin(mouse.y),
player.z - Math.cos(mouse.x) * Math.cos(mouse.y)
);
camera.lookAt(lookTarget);
}
// --- WEAPONS AND PARTICLE PIPELINES ---
function firePlayerProjectile() {
if(document.pointerLockElement !== document.body) return;
const geo = new THREE.SphereGeometry(0.2, 8, 8);
const mat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
const mesh = new THREE.Mesh(geo, mat);
mesh.position.set(player.x, 2.5, player.z);
const dir = new THREE.Vector3();
camera.getWorldDirection(dir);
scene.add(mesh);
projectiles.push({ mesh, dir: dir.clone() });
}
function createBossProjectile(pos, dir) {
const geo = new THREE.BoxGeometry(0.5, 0.5, 2);
const mat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
const mesh = new THREE.Mesh(geo, mat);
mesh.position.copy(pos);
mesh.lookAt(pos.clone().add(dir));
scene.add(mesh);
bossProjectiles.push({ mesh, dir });
}
function createExplosion(pos, color, count=10) {
for(let i=0; i<count; i++) {
const geo = new THREE.DodecahedronGeometry(0.15);
const mat = new THREE.MeshBasicMaterial({ color: color });
const mesh = new THREE.Mesh(geo, mat);
mesh.position.copy(pos);
scene.add(mesh);
particles.push({
mesh,
velocity: new THREE.Vector3((Math.random()-0.5)*0.4, (Math.random())*0.3, (Math.random()-0.5)*0.4),
life: 30
});
}
}
function updateProjectilesAndCollisions() {
// Player Laser Management
for (let i = projectiles.length - 1; i >= 0; i--) {
let p = projectiles[i];
p.mesh.position.addScaledVector(p.dir, CONFIG.projectileSpeed);
// Distance culling check
if (p.mesh.position.distanceTo(camera.position) > 150) {
scene.remove(p.mesh);
projectiles.splice(i, 1);
continue;
}
// Check collision against Core Boss
if (boss.mesh && boss.hp > 0) {
let dist = p.mesh.position.distanceTo(boss.mesh.position);
if (dist < 7) { // Hitbox radius threshold
boss.hp -= 15;
createExplosion(p.mesh.position, 0xff0055, 6);
document.getElementById('boss-hp-fill').style.width = ${(boss.hp / CONFIG.bossMaxHp) * 100}%;
scene.remove(p.mesh);
projectiles.splice(i, 1);
if(boss.hp <= 0) triggerBossDefeat();
continue;
}
}
}
// Boss Laser Processing
for (let i = bossProjectiles.length - 1; i >= 0; i--) {
let bp = bossProjectiles[i];
bp.mesh.position.addScaledVector(bp.dir, 0.4 + (boss.stage * 0.05));
// Hit local player
let pPos = new THREE.Vector3(player.x, 2, player.z);
if (bp.mesh.position.distanceTo(pPos) < 2.0) {
player.hp -= 10;
createExplosion(bp.mesh.position, 0x00ffcc, 15);
document.getElementById('player-hp-fill').style.width = ${player.hp}%;
scene.remove(bp.mesh);
bossProjectiles.splice(i, 1);
if (player.hp <= 0) alert("RE-SYNCHRONIZING TERMINAL... YOU DIED!");
continue;
}
// Out of range check
if(bp.mesh.position.length() > 150) {
scene.remove(bp.mesh);
bossProjectiles.splice(i, 1);
}
}
// Particle Decay Loop
for(let i = particles.length - 1; i >= 0; i--) {
let pt = particles[i];
pt.mesh.position.add(pt.velocity);
pt.life--;
if(pt.life <= 0) {
scene.remove(pt.mesh);
particles.splice(i, 1);
}
}
}
function triggerBossDefeat() {
createExplosion(boss.mesh.position, 0xffffff, 100);
boss.stage++;
document.getElementById('stage-val').innerText = boss.stage;
boss.hp = CONFIG.bossMaxHp + (boss.stage * 200);
document.getElementById('boss-hp-fill').style.width = "100%";
// Respawn with escalating parameters
boss.mesh.position.set((Math.random()-0.5)*40, 10, -30 - Math.random()*20);
}
// --- NETWORKING ENGINE (GitHub Pages Multiplayer Pipeline Simulation) ---
// Since GitHub Pages is purely flat static hosting, real architectures use external relays (like PeerJS, Socket.io, or tRPC).
// This fully simulated fallback system provides data mapping arrays to handle inbound/outbound payloads gracefully.
function initNetworkPipeline() {
setTimeout(() => {
document.getElementById('lobby-status').innerText = "🌐 Connected to Global GitHub Relay Sandbox Engine Server";
spawnRemotePeer('Player_Hash_98X');
spawnRemotePeer('Player_Hash_44F');
}, 2000);
}
function spawnRemotePeer(id) {
const geo = new THREE.ConeGeometry(1, 3, 4);
const mat = new THREE.MeshStandardMaterial({ color: 0xffaa00, wireframe: false });
const mesh = new THREE.Mesh(geo, mat);
mesh.position.set((Math.random() - 0.5) * 30, 1.5, (Math.random() - 0.5) * 30);
scene.add(mesh);
remotePlayers[id] = mesh;
}
function updateNetworkPeers(time) {
// Simulated synchronization logic matching positional arrays
let idx = 0;
for (let id in remotePlayers) {
idx++;
let rMesh = remotePlayers[id];
// Simulating inbound stream movement packets over time
rMesh.position.x += Math.sin(time * 0.001 + idx) * 0.05;
rMesh.position.z += Math.cos(time * 0.001 * idx) * 0.05;
rMesh.rotation.y += 0.01;
}
}
function onWindowResize() {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
}
// --- MAIN ENGINE ANIMATION LOOP ---
function animate(timestamp) {
requestAnimationFrame(animate);
updatePlayerPhysics();
runBossAI(timestamp);
updateProjectilesAndCollisions();
updateNetworkPeers(timestamp);
renderer.render(scene, camera);
}
// Launch Application Window Engine
window.onload = init;
